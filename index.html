<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<title>digital playground</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Cpath d='M2 2h1v12H2zM5 2h3v12H5zM10 2h1v12h-1zM12 2h2v12h-2z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&display=swap" rel="stylesheet">
<style>
  :root { --black: #000000; --white: #ffffff; color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--black); color: var(--white); overflow: hidden; }
  body { font-family: "Doto", ui-monospace, "SF Mono", Menlo, monospace; -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  .hud {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 24px calc(20px + env(safe-area-inset-bottom, 0px));
    display: flex; justify-content: space-between; align-items: flex-start; gap: 24px;
  }
  .hud > * { background: var(--black); padding: 6px 10px; margin: -6px -10px; }
  .name {
    font-size: clamp(22px, 3.2vw, 40px); line-height: 1; font-weight: var(--w, 800);
    letter-spacing: -0.01em; font-variant-numeric: tabular-nums;
  }
  .sub { display: block; font-size: 0.5em; line-height: 1.4; font-weight: 500; margin-top: 0.35em; }
  .clock { font-size: clamp(16px, 1.8vw, 22px); line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  @media (max-width: 560px) { .hud { flex-direction: column; gap: 14px; } }
</style>
</head>
<body>
<canvas id="c" aria-label="Moving black and white data patterns. Move across them, click or tap to rewrite a line."></canvas>
<div class="hud">
  <h1 class="name" id="name">rukitis.com<span class="sub">digital playground</span></h1>
  <div class="clock" id="clock">--:--:--</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const BLACK = '#000', WHITE = '#fff';
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];

  let W = 0, H = 0, DPR = 1, bands = [];

  // ── pattern generators: each draws one band into its own offscreen canvas ──
  function makePattern(type, h) {
    const len = Math.round(rand(900, 2600));
    const c = document.createElement('canvas');
    c.width = len; c.height = h;
    const g = c.getContext('2d');
    g.fillStyle = BLACK; g.fillRect(0, 0, len, h);
    g.fillStyle = WHITE;
    let x = 0;
    if (type === 'barcode') {
      const density = rand(0.35, 0.65);
      while (x < len) { const w = 1 + Math.floor(Math.random() * Math.random() * 9); if (Math.random() < density) g.fillRect(x, 0, w, h); x += w; }
    } else if (type === 'fine') {
      const pitch = pick([2, 2, 3, 4]);
      while (x < len) { const run = Math.floor(rand(20, 260)); if (Math.random() < 0.8) for (let i = 0; i < run; i += pitch) g.fillRect(x + i, 0, 1, h); x += run + Math.floor(rand(4, 60)); }
    } else if (type === 'matrix') {
      const s = pick([2, 3, 4]);
      for (let yy = 0; yy < h; yy += s) for (let xx = 0; xx < len; xx += s) if (Math.random() < 0.42) g.fillRect(xx, yy, s - 1, s - 1);
    } else if (type === 'ticks') {
      while (x < len) { const tall = Math.random() < 0.12; g.fillRect(x, tall ? 0 : h * 0.55, 1, tall ? h : h * 0.45); x += Math.floor(rand(3, 18)); }
    } else if (type === 'blocks') {
      while (x < len) { const w = Math.floor(rand(4, 140)); if (Math.random() < 0.5) g.fillRect(x, 0, w, h); x += w; }
    } else if (type === 'line') {
      g.fillRect(0, Math.floor(h / 2), len, 1);
    }
    return c;
  }

  function newBand(y, h, type) {
    const dir = Math.random() < 0.5 ? -1 : 1;
    const speed = type === 'line' ? 0 : dir * rand(12, type === 'blocks' ? 60 : 220);
    return { y, h, type, speed, off: rand(0, 2000), pat: makePattern(type, h), next: null, sweep: 0, focus: 0 };
  }

  function build() {
    bands = [];
    const unit = H < 700 ? 6 : 8;
    let y = 0;
    while (y < H) {
      const type = pick(['barcode', 'barcode', 'fine', 'matrix', 'ticks', 'blocks', 'line', 'gap', 'gap']);
      const h = type === 'line' ? unit : type === 'gap' ? unit * pick([1, 2, 4]) : unit * pick([1, 2, 3, 4, 6, 9, 12]);
      if (type !== 'gap') bands.push(newBand(y, Math.min(h, H - y), type));
      y += h;
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = false;
    build();
  }
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 120); });
  resize();

  // ── pointer: hover speeds a line up and inverts it, click/drag rewrites it ──
  const P = { x: -1, y: -1, sx: W / 2, active: false, down: false };
  const bandAt = y => bands.find(b => y >= b.y && y < b.y + b.h);
  function rewrite(b) { if (b && !b.next && b.type !== 'line') { b.next = makePattern(b.type, b.h); b.sweep = 0; } }

  canvas.addEventListener('pointermove', e => {
    P.x = e.clientX; P.y = e.clientY; P.active = true;
    if (P.down) rewrite(bandAt(P.y));
  });
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    P.down = true; P.x = e.clientX; P.y = e.clientY; P.active = true;
    rewrite(bandAt(P.y));
  });
  const up = e => { P.down = false; if (e.pointerType !== 'mouse') P.active = false; };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('pointerleave', () => { P.active = false; });

  // the name's weight follows the pointer across the screen
  const nameEl = document.getElementById('name');
  addEventListener('pointermove', e => {
    if (!reduce) nameEl.style.setProperty('--w', Math.round(200 + (e.clientX / W) * 700));
  });

  // ── clock ──
  const clock = document.getElementById('clock');
  const fmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Riga', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  const tick = () => { clock.textContent = `${fmt.format(new Date())} riga`; };
  tick(); setInterval(tick, 250);

  // ── draw ──
  function tile(img, y, off) {
    const len = img.width;
    let x = -(((off % len) + len) % len);
    for (; x < W; x += len) ctx.drawImage(img, Math.round(x), y);
  }

  let last = performance.now();
  function draw(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    P.sx += (P.x - P.sx) * 0.2;

    ctx.fillStyle = BLACK; ctx.fillRect(0, 0, W, H);

    for (const b of bands) {
      const hit = P.active && P.y >= b.y && P.y < b.y + b.h;
      b.focus += ((hit ? 1 : 0) - b.focus) * (hit ? 0.2 : 0.06);
      if (!reduce) b.off += b.speed * dt * (1 + b.focus * 7);

      tile(b.pat, b.y, b.off);

      // rewrite: new pattern sweeps in from the left behind a white line
      if (b.next) {
        b.sweep = Math.min(1, b.sweep + dt * (reduce ? 100 : 2.4));
        const edge = Math.round(b.sweep * W);
        ctx.save(); ctx.beginPath(); ctx.rect(0, b.y, edge, b.h); ctx.clip();
        tile(b.next, b.y, b.off); ctx.restore();
        ctx.fillStyle = WHITE; ctx.fillRect(edge, b.y, 1, b.h);
        if (b.sweep >= 1) { b.pat = b.next; b.next = null; }
      }

      // hover: an inverted window opens out from the pointer
      if (b.focus > 0.01) {
        const half = (W * 0.6) * b.focus;
        ctx.globalCompositeOperation = 'difference';
        ctx.fillStyle = WHITE;
        ctx.fillRect(Math.round(P.sx - half), b.y, Math.round(half * 2), b.h);
        ctx.globalCompositeOperation = 'source-over';
      }
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
