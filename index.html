<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<title>digital playground</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Cpath d='M0 3h16v1H0zM0 6h16v3H0zM0 11h16v1H0zM0 13h16v2H0z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/HostGrotesk.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Host Grotesk"; src: url("fonts/HostGrotesk.woff2") format("woff2"); font-weight: 300 800; font-display: swap; }
  :root { --black: #000000; --white: #ffffff; --grey: #9a9a9a; color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--black); color: var(--white); overflow: hidden; }
  body { font-family: "Host Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  .hud {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 24px calc(20px + env(safe-area-inset-bottom, 0px));
    display: flex; justify-content: space-between; align-items: flex-start; gap: 24px;
    font-size: 15px; line-height: 20px; font-weight: 500; letter-spacing: -0.005em;
  }
  .hud > * { background: var(--black); padding: 6px 10px; margin: -6px -10px; }
  .hud span { display: block; }
  .clock { white-space: nowrap; }
  @media (max-width: 560px) { .hud { font-size: 13px; line-height: 18px; } }
  :root { --white: #ced1bc; }
  canvas { image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c" aria-label="Soft pale shapes drifting and merging on black, rendered in two colours with dithered edges. The pointer pulls a shape along with it."></canvas>
<div class="hud">
  <div><span>rukitis.com</span><span>digital playground</span></div>
  <div class="clock" id="clock">--:--:--</div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  let W = 0, H = 0, DPR = 1;
  const P = { x: -1, y: -1, sx: -1, sy: -1, active: false, down: false };

  const clock = document.getElementById('clock');
  const fmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Riga', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  const tick = () => { clock.textContent = `${fmt.format(new Date())} riga`; };
  tick(); setInterval(tick, 250);

  canvas.addEventListener('pointermove', e => { P.x = e.clientX; P.y = e.clientY; P.active = true; if (P.down && window.onDrag) onDrag(); });
  canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); P.down = true; P.x = e.clientX; P.y = e.clientY; P.active = true; if (window.onPress) onPress(); });
  const up = e => { P.down = false; if (e.pointerType !== 'mouse') P.active = false; };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('pointerleave', () => { P.active = false; });

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = false;
    if (P.sx < 0) { P.sx = W / 2; P.sy = H / 2; }
    if (window.onResize) onResize();
  }
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 120); });


  // two inks, sampled from the reference photos
  const INK = [0, 0, 0], PAPER = [206, 209, 188];
  // 8×8 Bayer matrix, normalised to 0–1
  const B8 = [0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,60,28,52,20,62,30,54,22,3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,63,31,55,23,61,29,53,21].map(v => (v + 0.5) / 64);

  const PX = () => (W < 560 ? 3 : 4);       // dither pixel size, like tooooools "pixel size"
  let gw = 0, gh = 0, img, buf, blobs = [], field = null, lo = 1, hi = 2, primed = false;
  const low = document.createElement('canvas'); const lg = low.getContext('2d');

  function blob(big) {
    const r = big ? rand(0.16, 0.34) : Math.pow(Math.random(), 1.8) * 0.1 + 0.025;
    return { x: rand(0, 1), y: rand(0, 1), r, vx: rand(-1, 1) * 0.012 / (r * 6), vy: rand(-1, 1) * 0.008 / (r * 6), ph: rand(0, 6.28), w: rand(0.3, 1.1) };
  }
  window.onResize = () => {
    const p = PX(); gw = Math.ceil(W / p); gh = Math.ceil(H / p);
    low.width = gw; low.height = gh; img = lg.createImageData(gw, gh); buf = img.data;
    if (!blobs.length) { for (let i = 0; i < 5; i++) blobs.push(blob(true)); for (let i = 0; i < 22; i++) blobs.push(blob(false)); }
  };
  window.onPress = () => { const b = blob(Math.random() < 0.3); b.x = P.x / W; b.y = P.y / H; b.vx *= 0.3; b.vy *= 0.3; blobs.push(b); if (blobs.length > 40) blobs.splice(5, 1); };

  // cheap smooth value noise for the soft, uneven edges
  const N = 256, perm = new Uint8Array(N * 2), gv = new Float32Array(N);
  for (let i = 0; i < N; i++) { perm[i] = i; gv[i] = Math.random(); }
  for (let i = N - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  for (let i = 0; i < N; i++) perm[i + N] = perm[i];
  const fade = t => t * t * (3 - 2 * t);
  function noise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const a = gv[perm[(xi & 255) + perm[yi & 255]]], b = gv[perm[((xi + 1) & 255) + perm[yi & 255]]];
    const c = gv[perm[(xi & 255) + perm[(yi + 1) & 255]]], d = gv[perm[((xi + 1) & 255) + perm[(yi + 1) & 255]]];
    const u = fade(xf), v = fade(yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }

  function draw(t, dt) {
    if (!gw) return;
    const asp = W / H, tt = reduce ? 0 : t;
    // move the blobs; they wrap around the edges
    if (!reduce) for (const b of blobs) {
      b.x += (b.vx + Math.sin(tt * 0.3 + b.ph) * 0.004) * dt; b.y += (b.vy + Math.cos(tt * 0.23 + b.ph) * 0.004) * dt;
      if (b.x < -0.4) b.x += 1.8; if (b.x > 1.4) b.x -= 1.8; if (b.y < -0.4) b.y += 1.8; if (b.y > 1.4) b.y -= 1.8;
    }
    // the pointer carries its own shape that merges with whatever it touches
    const list = blobs.slice();
    if (P.active && P.sx >= 0) list.push({ x: P.sx / W, y: P.sy / H, r: 0.085, w: 1 });

    const n = list.length, bx = new Float32Array(n), by = new Float32Array(n), br = new Float32Array(n);
    for (let i = 0; i < n; i++) { const b = list[i]; bx[i] = b.x * asp; by[i] = b.y; const breathe = 1 + Math.sin(tt * 0.6 + (b.ph || 0)) * 0.08; br[i] = (b.r * breathe) ** 2; }

    if (!field || field.length !== gw * gh) field = new Float32Array(gw * gh);
    let k = 0;
    for (let y = 0; y < gh; y++) {
      const v = y / gh;
      for (let x = 0; x < gw; x++) {
        const u = (x / gw) * asp;
        // metaball field
        let f = 0;
        for (let i = 0; i < n; i++) { const dx = u - bx[i], dy = v - by[i]; f += br[i] / (dx * dx + dy * dy + 0.0004); }
        // ragged edges: low-frequency warp
        f *= 0.7 + noise(x * 0.035 + tt * 0.15, y * 0.035 - tt * 0.1) * 0.6;
        field[k++] = f;
      }
    }
    // keep roughly half the screen pale, like the photos: thresholds come from the field itself
    const S = 600, smp = new Float32Array(S);
    for (let i = 0; i < S; i++) smp[i] = field[(Math.random() * field.length) | 0];
    smp.sort();
    const ease = primed ? 0.05 : 1; primed = true;
    const tLo = lo += (smp[(S * 0.44) | 0] - lo) * ease, tHi = hi += (smp[(S * 0.58) | 0] - hi) * ease;
    const span = Math.max(tHi - tLo, 1e-6);
    k = 0; let q = 0;
    for (let y = 0; y < gh; y++) {
      for (let x = 0; x < gw; x++) {
        // black point / white point: only a narrow band becomes the dithered gradient
        let g = (field[q++] - tLo) / span + (Math.random() - 0.5) * 0.18;
        const on = g > B8[(y & 7) * 8 + (x & 7)];
        const c = on ? PAPER : INK;
        buf[k++] = c[0]; buf[k++] = c[1]; buf[k++] = c[2]; buf[k++] = 255;
      }
    }
    lg.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(low, 0, 0, gw * PX(), gh * PX());
  }


  resize();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    P.sx += (P.x - P.sx) * 0.15; P.sy += (P.y - P.sy) * 0.15;
    draw(now / 1000, dt);
    requestAnimationFrame(frame);
  }
  const start = () => requestAnimationFrame(frame);
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => { if (window.onFonts) onFonts(); start(); });
})();
</script>
</body>
</html>
